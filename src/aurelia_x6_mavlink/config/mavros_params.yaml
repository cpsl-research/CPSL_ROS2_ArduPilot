/**:
  ros__parameters:
    fcu_url: "/dev/ttyACM0:115200"
    gcs_url: ""
    system_id: 255
    component_id: 240
    tgt_system: 1
    tgt_component: 1
    plugin_allowlist:
      - sys_status
      - sys_time
      - imu
      - local_position
      - global_position
      # Browser/API flight controls: arm, takeoff/land, mode changes.
      - command
      # Console publishes forward velocity and yaw-rate setpoints here:
      # /mavros/setpoint_velocity/cmd_vel_unstamped
      - setpoint_velocity
      # Console mission upload/start and FC-enforced permitted-area polygons.
      - waypoint
      - geofence
